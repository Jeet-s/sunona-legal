<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Simran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0E0913; --card:#141019; --mag:#FF2E7E; --vio:#B14BFF; --tx:#F3F1F6; --mut:rgba(255,255,255,.66); --bd:rgba(255,255,255,.1); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:'Poppins',system-ui,-apple-system,sans-serif; line-height:1.65; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 20px 80px; }
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
  .brand .dot { width:14px; height:14px; border-radius:50%; background:var(--mag); }
  .brand b { font-weight:800; font-size:22px; background:linear-gradient(90deg,var(--mag),var(--vio)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  h1 { font-weight:800; font-size:34px; line-height:1.2; margin:0 0 8px; }
  h2 { font-weight:700; font-size:21px; margin:34px 0 8px; color:#fff; }
  h3 { font-weight:600; font-size:17px; margin:22px 0 6px; }
  p, li { color:var(--mut); font-size:15.5px; }
  strong { color:var(--tx); font-weight:600; }
  a { color:var(--mag); }
  ul { padding-left:20px; }
  li { margin:4px 0; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:20px; padding:28px 30px; }
  .nav { margin-top:36px; font-size:14px; }
  .nav a { color:var(--vio); margin-right:18px; }
  footer { margin-top:40px; color:rgba(255,255,255,.4); font-size:13px; }
</style></head>
<body><div class="wrap">
  <div class="brand"><span class="dot"></span><b>Simran</b></div>
  <div class="card">
<h1>Simran</h1>
<p>Your Hindi AI companion. Choose a document:</p>

  <li><a href="terms/">Terms of Service</a></li>
</ul>
</div>
  <div class="nav"><a href="privacy/">Privacy Policy</a><a href="terms/">Terms of Service</a></div>
